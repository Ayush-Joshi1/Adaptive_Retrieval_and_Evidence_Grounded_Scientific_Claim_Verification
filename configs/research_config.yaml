dataset:
  name: "BEIR SciFact"
  source: "BeIR/scifact, BeIR/scifact-qrels, official SciFact claim files"
  split_strategy: "official_train_dev_test_alignment"
  tuning_split: "official_dev_claims"
  final_split: "official_test_claims"
  use_test_qrels_for_model_selection: false
  notes: "Do not use BEIR test qrels or official test labels for model selection. The BEIR test split aligns with the official dev set."

models:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  embedding_revision: "not_pinned"
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  reranker_revision: "not_pinned"
  generator_model: "gemini-2.5-flash-lite"
  generator_optional: true

retrieval:
  vector_index: "faiss.IndexFlatIP"
  embedding_dimension: 384
  retrieval_depths: [1, 3, 5, 10]
  device: "CPU"
  random_seed: 42

metrics:
  hit_at_k: "At least one relevant document appears in the first K retrieval results."
  precision_at_k: "Relevant retrieved documents divided by K. When no result appears, precision is 0.0."
  recall_at_k: "Relevant retrieved documents divided by all relevant documents in the query qrels. Queries with no relevant judgments receive 0.0."
  mrr_at_k: "Reciprocal rank of the first relevant document in the top K."
  map_at_k: "Average precision over the top K results."
  ndcg_at_k: "Discounted cumulative gain normalized by the ideal ordering when graded relevance is available."

reproducibility:
  python_version: "3.13.7"
  dependency_versions: "Pinned in requirements.txt"
  run_root: "results/runs"
  run_id_prefix: "phase1"
  preserve_historical_outputs: true
