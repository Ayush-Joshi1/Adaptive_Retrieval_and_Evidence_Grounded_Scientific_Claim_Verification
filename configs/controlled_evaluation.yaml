phase: 5
experiment: "Controlled Experiments"
dataset: "BEIR SciFact"

random_seed: 42
bootstrap_resamples: 10000
confidence_level: 0.95
significance_threshold: 0.05
holm_correction: true
device: "cpu"
torch_threads: 2

models:
  embedding: "sentence-transformers/all-MiniLM-L6-v2"
  cross_encoder: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  reranker_batch_size: 16

retrieval:
  dense_index: "FAISS IndexFlatIP"
  bm25_k1: 1.5
  bm25_b: 0.75
  hybrid_rrf_constant: 60
  hybrid_component_depth: 100
  candidate_pool: 50
  cutoffs: [1, 3, 5, 10]

adaptive:
  strategy: "score_gap"
  threshold: 0.10
  initial_depth: 10
  fallback_depth: 20
  maximum_depth: 50

evidence:
  inherited_configuration: "configs/evidence_grounding.yaml"
  evidence_selection_relevance_threshold: 0.25
  evidence_mapping_relevance_threshold: 0.25
  verdict_confidence_threshold: 0.60
  unresolved_conflict_margin: 0.15

systems:
  - bm25_baseline
  - dense_baseline
  - hybrid_baseline
  - hybrid_cross_encoder
  - dense_adaptive_score_gap
  - hybrid_evidence_grounded
